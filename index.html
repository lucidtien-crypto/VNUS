
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<title>Voice Translator</title>

<style>
:root {
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --field:#FBFCFE;
  --ink:#243044;
  --muted:#7B8796;
  --line:#E0E7EF;
  --green:#078363;
  --greenbg:#EAF8F1;
  --blue:#2863B8;
  --bluebg:#ECF3FF;
  --red:#D84848;
  --shadow:0 5px 24px #1B35500A;
}
body.dark {
  --bg:#141920;
  --card:#1E2630;
  --field:#242E39;
  --ink:#F2F5FA;
  --muted:#A8B4C2;
  --line:#3A4655;
  --greenbg:#143B30;
  --bluebg:#1C3554;
  --shadow:0 5px 24px #0003;
}
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100svh;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
  padding:
    max(12px,env(safe-area-inset-top))
    max(9px,env(safe-area-inset-right))
    max(22px,env(safe-area-inset-bottom))
    max(9px,env(safe-area-inset-left));
}
button,textarea { font:inherit; }
button {
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button:disabled { opacity:.45;cursor:not-allowed; }
button:focus-visible,textarea:focus-visible {
  outline:3px solid #63A9E8;
  outline-offset:2px;
}
.app {
  max-width:850px;
  margin:auto;
  display:grid;
  gap:11px;
}
header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  min-height:45px;
}
.brand {
  display:flex;
  align-items:center;
  gap:10px;
}
.logo {
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:var(--green);
  color:white;
}
.logo svg { width:22px;height:22px; }
h1 {
  margin:0;
  font-size:clamp(18px,4vw,23px);
  letter-spacing:-.6px;
}
.header-actions { display:flex;gap:6px; }
.small {
  min-width:38px;
  height:38px;
  padding:0 8px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--card);
  color:var(--ink);
  font-size:14px;
  font-weight:700;
}
.statusbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:0 4px;
  min-height:23px;
  color:var(--muted);
  font-size:12px;
}
.status-left {
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}
#status { overflow-wrap:anywhere; }
.dot {
  width:8px;
  height:8px;
  border-radius:50%;
  background:#19A37C;
  flex-shrink:0;
}
.dot.listen {
  background:#E04B4B;
  animation:pulse 1.3s infinite;
}
.dot.work {
  background:#DFA12D;
  animation:pulse 1.6s infinite;
}
.dot.error { background:#E04B4B; }
@keyframes pulse {
  50% { opacity:.35;transform:scale(.9); }
}
.panel {
  padding:14px;
  border:1px solid var(--line);
  border-radius:17px;
  background:var(--card);
  box-shadow:var(--shadow);
  display:grid;
  gap:11px;
  transition:border-color .15s;
}
.panel.active-vi { border-color:#46B293; }
.panel.active-en { border-color:#74A5E7; }
.panel-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  min-height:39px;
}
.panel-title {
  display:flex;
  align-items:center;
  gap:9px;
  font-size:17px;
  font-weight:750;
}
.note {
  color:var(--muted);
  font-size:12px;
}
textarea {
  width:100%;
  min-height:164px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--field);
  color:var(--ink);
  font-size:23px;
  line-height:1.6;
  resize:vertical;
  outline:none;
}
textarea:focus { border-color:#64B49A; }
textarea::placeholder {
  color:var(--muted);
  opacity:.7;
}
.controls {
  display:grid;
  grid-template-columns:
    minmax(105px,1.65fr)
    repeat(3,minmax(55px,1fr));
  gap:7px;
}
.btn {
  min-height:59px;
  padding:8px 4px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--ink);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
  font-weight:650;
  transition:transform .12s;
}
.btn:active:not(:disabled) { transform:scale(.97); }
.btn svg {
  width:20px;
  height:20px;
  flex-shrink:0;
}
.btn span {
  font-size:11px;
  text-align:center;
}
.mic-vi {
  color:var(--green);
  background:var(--greenbg);
  border-color:#A8D7C6;
}
.mic-en {
  color:var(--blue);
  background:var(--bluebg);
  border-color:#AAC7EC;
  flex-direction:row;
  gap:10px;
  padding:10px 15px;
}
.mic-en span { font-size:14px; }
.recording {
  background:var(--red)!important;
  border-color:var(--red)!important;
  color:white!important;
}
.danger { color:var(--red); }
.speaker {
  width:40px;
  height:40px;
  border:1px solid #A9D2C2;
  background:var(--greenbg);
  color:var(--green);
  border-radius:11px;
  display:grid;
  place-items:center;
}
.speaker svg { width:23px;height:23px; }
.speaker.playing {
  background:var(--green);
  color:white;
  animation:speakerPulse 1.8s infinite;
}
@keyframes speakerPulse {
  50% { box-shadow:0 0 0 6px #0D9D741A; }
}
.english-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.footer {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:2px 4px;
  color:var(--muted);
  font-size:11px;
}
.toast {
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translate(-50%,12px);
  width:max-content;
  max-width:90vw;
  padding:11px 16px;
  border-radius:12px;
  background:#293748;
  color:white;
  text-align:center;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s,transform .2s;
  z-index:100;
}
.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}
@media(max-width:520px) {
  .app { gap:9px; }
  .panel { padding:11px;gap:9px; }
  .panel-title { font-size:16px; }
  textarea { min-height:154px;padding:12px; }
  .controls { gap:5px; }
  .btn { min-height:60px;padding:7px 3px; }
  .btn span { font-size:10px; }
  .mic-en span { font-size:13px; }
  .note { font-size:11px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>
<main class="app">

<header>
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"
       stroke-linecap="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>
    </div>
    <h1>Voice Translator</h1>
  </div>
  <div class="header-actions">
    <button class="small" id="fontDown"
     aria-label="Giảm cỡ chữ">A−</button>
    <button class="small" id="fontUp"
     aria-label="Tăng cỡ chữ">A+</button>
    <button class="small" id="theme"
     aria-label="Chế độ sáng tối">◐</button>
  </div>
</header>

<div class="statusbar" role="status" aria-live="polite">
  <div class="status-left">
    <span class="dot" id="dot"></span>
    <span id="status">Sẵn sàng</span>
  </div>
  <span id="network">Online</span>
</div>

<section class="panel" id="viPanel">
  <div class="panel-head">
    <div class="panel-title">Tiếng Việt</div>
    <span class="note" id="viNote">Vietnamese</span>
  </div>

  <textarea id="viText"
    aria-label="Nội dung tiếng Việt"
    spellcheck="true"
    placeholder="Nói tiếng Việt tại đây..."></textarea>

  <div class="controls">
    <button class="btn mic-vi" id="viMic">
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"
       stroke-linecap="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>
      <span id="viLabel">Nói tiếng Việt</span>
    </button>

    <button class="btn" id="deleteWord">
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round">
        <path d="M4 7h16M6 7l1 14h10l1-14M9 7V4h6v3"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
      <span>Xóa 1 từ</span>
    </button>

    <button class="btn danger" id="clearVi">
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round">
        <path d="M4 7h16M6 7l1 14h10l1-14M9 7V4h6v3"/>
        <path d="M10 11v6M14 11v6"/>
      </svg>
      <span>Xóa hết</span>
    </button>

    <button class="btn" id="undoVi" disabled>
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="1.9"
       stroke-linecap="round"
       stroke-linejoin="round">
        <path d="M9 14 4 9l5-5M4 9h9a7 7 0 0 1 0 14"/>
      </svg>
      <span>Phục hồi</span>
    </button>
  </div>
</section>

<section class="panel" id="enPanel">
  <div class="panel-head">
    <div class="panel-title">
      <button class="speaker" id="speaker"
       aria-label="Phát tiếng Anh rồi nghe khách"
       title="Phát tiếng Anh rồi nghe khách">
        <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round"
         stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
          <path d="M15 9a5 5 0 0 1 0 6"/>
          <path d="M18 6a9 9 0 0 1 0 12"/>
        </svg>
      </button>
      <span>English (US)</span>
    </div>
    <span class="note" id="enNote">American English</span>
  </div>

  <textarea id="enText"
    aria-label="English text"
    spellcheck="true"
    placeholder="English translation appears here..."></textarea>

  <div class="english-footer">
    <button class="btn mic-en" id="enMic">
      <svg viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2"
       stroke-linecap="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
      </svg>
      <span id="enLabel">Speak English</span>
    </button>
    <span class="note">English → Vietnamese</span>
  </div>
</section>

<div class="footer">
  <span id="stats">0 từ · 0 ký tự</span>
  <span>VI ↔ EN (US)</span>
</div>

</main>

<div class="toast" id="toast"></div>

<script>
'use strict';

// ========================================
// 1. CẤU HÌNH
// ========================================

const CONFIG = {
  // Email phụ dành riêng cho MyMemory.
  // Email sẽ công khai nếu đăng lên GitHub.
  myMemoryEmail:'lucid.tien11202026@gmail.com',

  viLang:'vi-VN',
  enLang:'en-US',

  // Mỗi lượt chỉ dịch một câu hoặc một đoạn mới.
  maxCharacters:450,

  // Đợi loa phát hết và âm vang giảm.
  speakerCooldown:600,

  // Đợi sau khi người dùng sửa văn bản.
  editDelay:800,

  // Thời gian chờ dịch tối đa.
  requestTimeout:12000,

  // Số câu dịch được nhớ trong bộ nhớ máy.
  cacheSize:150
};

const $ = id => document.getElementById(id);

const viText = $('viText');
const enText = $('enText');
const viMic = $('viMic');
const enMic = $('enMic');
const speaker = $('speaker');

const Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

const KEYS = {
  vi:'voice_vi_v3',
  en:'voice_en_v3',
  theme:'voice_theme_v3',
  font:'voice_font_v3',
  cache:'voice_cache_v3'
};

// ========================================
// 2. TRẠNG THÁI
// ========================================

let recognition = null;
let activeLanguage = null;
let recognitionId = 0;

let speechUtterance = null;
let speaking = false;

let translationId = 0;
let translationController = null;
let translationPending = false;
let translationTimer = null;
let autoListenTimer = null;
let toastTimer = null;

let fontSize = 23;
let undoStack = [];

// Bản tiếng Anh đang hiển thị có hợp lệ không?
let englishReady = false;

let translationCache = {};

// ========================================
// 3. GIAO DIỆN VÀ LƯU TRỮ
// ========================================

function store(key,value) {
  try {
    localStorage.setItem(key,JSON.stringify(value));
  } catch(error) {}
}

function load(key,fallback) {
  try {
    const value = localStorage.getItem(key);
    return value === null ? fallback : JSON.parse(value);
  } catch(error) {
    return fallback;
  }
}

function setStatus(message,mode='ready') {
  $('status').textContent = message;
  $('dot').className =
    mode === 'ready' ? 'dot' : `dot ${mode}`;
}

function toast(message) {
  $('toast').textContent = message;
  $('toast').classList.add('show');

  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    $('toast').classList.remove('show');
  },2800);
}

function stats() {
  const value = viText.value.trim();
  const words = value ? value.split(/\s+/u).length : 0;
  $('stats').textContent =
    `${words} từ · ${viText.value.length} ký tự`;
}

function saveTexts() {
  store(KEYS.vi,viText.value);
  store(KEYS.en,enText.value);
  stats();
}

function setText(language,text) {
  if (language === 'vi') {
    viText.value = text;
  } else {
    enText.value = text;
  }
  saveTexts();
}

function updateConnection() {
  $('network').textContent =
    navigator.onLine ? 'Online' : 'Offline';
}

window.addEventListener('online',updateConnection);
window.addEventListener('offline',updateConnection);

function capitalize(text) {
  if (!text) return '';
  return text.charAt(0).toUpperCase() + text.slice(1);
}

const MIC_ICON = `
<svg viewBox="0 0 24 24" fill="none"
 stroke="currentColor" stroke-width="2"
 stroke-linecap="round">
 <rect x="9" y="3" width="6" height="12" rx="3"/>
 <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
</svg>`;

const STOP_ICON = `
<svg viewBox="0 0 24 24" fill="none"
 stroke="currentColor" stroke-width="2"
 stroke-linecap="round">
 <rect x="5" y="5" width="14" height="14" rx="3"/>
</svg>`;

function micUI(language,active) {
  const button = language === 'vi' ? viMic : enMic;
  const label = language === 'vi' ? $('viLabel') : $('enLabel');

  button.classList.toggle('recording',active);
  button.querySelector('svg').outerHTML =
    active ? STOP_ICON : MIC_ICON;

  label.textContent = active
    ? (language === 'vi' ? 'Dừng nói' : 'Stop Listening')
    : (language === 'vi' ? 'Nói tiếng Việt' : 'Speak English');

  $('viPanel').classList.toggle(
    'active-vi',active && language === 'vi'
  );
  $('enPanel').classList.toggle(
    'active-en',active && language === 'en'
  );
}

function resetMicUI() {
  micUI('vi',false);
  micUI('en',false);
}

// ========================================
// 4. BỘ NHỚ DỊCH
// ========================================

// Một câu giống nhau chỉ cần dịch online một lần
// trên cùng trình duyệt khi còn trong cache.

translationCache = load(KEYS.cache,{});

if (
  !translationCache ||
  typeof translationCache !== 'object' ||
  Array.isArray(translationCache)
) {
  translationCache = {};
}

function cacheKey(text,from,to) {
  return `${from}|${to}|${text.trim()}`;
}

function getCached(text,from,to) {
  const key = cacheKey(text,from,to);
  return Object.prototype.hasOwnProperty.call(
    translationCache,key
  ) ? translationCache[key] : null;
}

function saveCached(text,from,to,result) {
  const key = cacheKey(text,from,to);

  // Đưa câu vừa dùng xuống cuối danh sách.
  delete translationCache[key];
  translationCache[key] = result;

  const keys = Object.keys(translationCache);

  while (keys.length > CONFIG.cacheSize) {
    const oldest = keys.shift();
    delete translationCache[oldest];
  }

  store(KEYS.cache,translationCache);
}

// ========================================
// 5. DỪNG YÊU CẦU DỊCH CŨ
// ========================================

function cancelTranslation() {
  translationId++;

  clearTimeout(translationTimer);
  translationTimer = null;

  if (translationController) {
    translationController.abort();
    translationController = null;
  }

  translationPending = false;
}

// ========================================
// 6. MYMEMORY API
// ========================================

async function translateOnline(text,from,to,signal) {
  const value = text.trim();

  if (!value) return '';

  if (value.length > CONFIG.maxCharacters) {
    throw new Error(
      'Câu quá dài. Hãy chia thành đoạn ngắn hơn.'
    );
  }

  const saved = getCached(value,from,to);
  if (saved !== null) return saved;

  if (!navigator.onLine) {
    throw new Error('Không có kết nối Internet');
  }

  const url = new URL(
    'https://api.mymemory.translated.net/get'
  );

  // QUAN TRỌNG: q là câu cần dịch,
  // de là email dùng nhận diện hạn mức.
  url.searchParams.set('q',value);
  url.searchParams.set('langpair',`${from}|${to}`);
  url.searchParams.set('de',CONFIG.myMemoryEmail);

  const response = await fetch(url.toString(),{
    method:'GET',
    signal,
    cache:'no-store'
  });

  if (!response.ok) {
    throw new Error(`Lỗi máy chủ: ${response.status}`);
  }

  const data = await response.json();

  if (data.quotaFinished === true) {
    throw new Error('Đã hết hạn mức dịch hôm nay');
  }

  if (Number(data.responseStatus) !== 200) {
    throw new Error(
      data.responseDetails || 'Dịch vụ không thể dịch'
    );
  }

  const raw = data.responseData?.translatedText;

  if (typeof raw !== 'string' || !raw.trim()) {
    throw new Error('Dịch vụ không trả về bản dịch');
  }

  // Giải mã HTML entities.
  const decoder = document.createElement('textarea');
  decoder.innerHTML = raw;
  const result = decoder.value.trim();

  if (/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(result)) {
    throw new Error('MyMemory đã giới hạn yêu cầu');
  }

  saveCached(value,from,to,result);
  return result;
}

// ========================================
// 7. DỊCH MỘT LƯỢT HỘI THOẠI
// ========================================

async function translateTurn(language,text) {
  cancelTranslation();

  const id = translationId;
  const source = text.trim();
  const isVI = language === 'vi';
  const targetLanguage = isVI ? 'en' : 'vi';

  if (isVI) {
    englishReady = false;
    setText('en','');
  } else {
    setText('vi','');
  }

  if (!source) {
    setStatus('Sẵn sàng');
    return;
  }

  const controller = new AbortController();
  translationController = controller;
  translationPending = true;

  const timer = setTimeout(
    () => controller.abort(),
    CONFIG.requestTimeout
  );

  setStatus(
    isVI
      ? 'Đang dịch sang tiếng Anh...'
      : 'Translating to Vietnamese...',
    'work'
  );

  try {
    const translated = await translateOnline(
      source,
      isVI ? 'vi' : 'en',
      isVI ? 'en' : 'vi',
      controller.signal
    );

    if (id !== translationId) return;

    setText(targetLanguage,capitalize(translated));

    if (isVI) {
      englishReady = true;
      $('enNote').textContent = 'Đã dịch';
      setStatus('Đã dịch · Bấm loa để phát');
    } else {
      $('viNote').textContent = 'Đã dịch';
      setStatus('Đã dịch · Đọc tiếng Việt');
    }

  } catch(error) {
    if (id !== translationId) return;

    const message = error.name === 'AbortError'
      ? 'Dịch quá thời gian chờ'
      : error.message;

    setStatus('Không dịch được','error');
    toast(message);

  } finally {
    clearTimeout(timer);

    if (id === translationId) {
      translationController = null;
      translationPending = false;
    }
  }
}

// ========================================
// 8. ÂM THANH LOA ENGLISH
// ========================================

function cancelAutoListen() {
  clearTimeout(autoListenTimer);
  autoListenTimer = null;
}

function cancelSpeaker() {
  cancelAutoListen();

  speechUtterance = null;
  speaking = false;

  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }

  speaker.classList.remove('playing');
}

function chooseVoice() {
  if (!('speechSynthesis' in window)) return null;

  const voices = speechSynthesis.getVoices();

  return voices.find(
    v => v.lang.toLowerCase() === 'en-us'
  ) || voices.find(
    v => v.lang.toLowerCase().startsWith('en')
  ) || null;
}

function speakEnglish() {
  if (!('speechSynthesis' in window)) {
    toast('Trình duyệt không hỗ trợ phát âm');
    return;
  }

  if (speaking) {
    cancelSpeaker();
    setStatus('Đã dừng phát');
    return;
  }

  if (translationPending || !englishReady) {
    toast('Hãy đợi bản dịch tiếng Anh sẵn sàng');
    return;
  }

  const content = enText.value.trim();

  if (!content) {
    toast('Không có tiếng Anh để phát');
    return;
  }

  stopRecognition();
  cancelSpeaker();

  const utter = new SpeechSynthesisUtterance(content);
  utter.lang = CONFIG.enLang;
  utter.rate = 0.94;
  utter.pitch = 1;
  utter.volume = 1;

  const voice = chooseVoice();
  if (voice) utter.voice = voice;

  speechUtterance = utter;
  speaking = true;

  let started = false;

  utter.onstart = () => {
    if (speechUtterance !== utter) return;

    started = true;
    speaker.classList.add('playing');
    setStatus('Speaking English...','work');
  };

  utter.onend = () => {
    if (speechUtterance !== utter) return;

    speechUtterance = null;
    speaking = false;
    speaker.classList.remove('playing');

    if (!started) {
      setStatus('Đã phát xong');
      return;
    }

    setStatus('Chuẩn bị nghe khách...','work');

    // Tự thử mở micro sau khi loa phát xong.
    // iOS có thể yêu cầu bấm thủ công.
    autoListenTimer = setTimeout(() => {
      autoListenTimer = null;

      if (!speaking && !recognition) {
        startRecognition('en',true);
      }
    },CONFIG.speakerCooldown);
  };

  utter.onerror = () => {
    if (speechUtterance !== utter) return;

    speechUtterance = null;
    speaking = false;
    speaker.classList.remove('playing');

    setStatus('Không thể phát tiếng Anh','error');
    toast('Kiểm tra loa hoặc thử bấm lại');
  };

  try {
    speechSynthesis.cancel();
    speechSynthesis.speak(utter);
    setStatus('Đang chuẩn bị phát...','work');
  } catch(error) {
    cancelSpeaker();
    setStatus('Không thể phát tiếng Anh','error');
  }
}

speaker.onclick = speakEnglish;

// ========================================
// 9. DỪNG MICRO
// ========================================

function stopRecognition() {
  cancelAutoListen();

  recognitionId++;

  const old = recognition;

  recognition = null;
  activeLanguage = null;

  if (old) {
    try { old.abort(); } catch(error) {}
  }

  resetMicUI();
}

function finishSpeaking() {
  if (!recognition) return;

  setStatus('Đang hoàn tất câu...','work');

  try {
    recognition.stop();
  } catch(error) {
    stopRecognition();
  }
}

// ========================================
// 10. NHẬN DẠNG GIỌNG NÓI
// ========================================

function startRecognition(language,automatic=false) {
  cancelAutoListen();

  if (!Recognition) {
    setStatus('Không hỗ trợ nhận dạng','error');
    toast('Hãy thử Safari trên iPhone hoặc Chrome Android');
    return;
  }

  cancelSpeaker();
  stopRecognition();
  cancelTranslation();

  const id = recognitionId;
  const isVI = language === 'vi';
  const target = isVI ? viText : enText;

  // Giữ lại nội dung cũ nếu không nghe được câu nào.
  const previousText = target.value;

  const session = new Recognition();
  recognition = session;
  activeLanguage = language;

  session.lang = isVI ? CONFIG.viLang : CONFIG.enLang;
  session.continuous = false;
  session.interimResults = true;
  session.maxAlternatives = 1;

  let finalText = '';
  let interimText = '';
  let errorCode = null;
  let finished = false;

  session.onstart = () => {
    if (id !== recognitionId) {
      try { session.abort(); } catch(e) {}
      return;
    }

    micUI(language,true);

    setStatus(
      isVI ? 'Đang nghe tiếng Việt...'
           : 'Listening to English...',
      'listen'
    );
  };

  session.onresult = event => {
    if (id !== recognitionId) return;

    finalText = '';
    interimText = '';

    for (let i=0;i<event.results.length;i++) {
      const item = event.results[i];
      const phrase = item[0]?.transcript?.trim() || '';

      if (!phrase) continue;

      if (item.isFinal) {
        finalText += (finalText ? ' ' : '') + phrase;
      } else {
        interimText += (interimText ? ' ' : '') + phrase;
      }
    }

    // Chỉ hiển thị lời nói của lượt này.
    // Không nối với các câu bán hàng trước.
    target.value = capitalize(
      [finalText,interimText].filter(Boolean).join(' ')
    );

    stats();
    target.scrollTop = target.scrollHeight;
  };

  session.onerror = event => {
    if (id !== recognitionId) return;

    errorCode = event.error;

    if (errorCode === 'no-speech') {
      setStatus('Chưa nghe được giọng nói','error');
      return;
    }

    if (
      errorCode === 'not-allowed' ||
      errorCode === 'service-not-allowed'
    ) {
      setStatus('Micro bị chặn','error');
      toast(
        automatic
          ? 'Hãy bấm Speak English để bật micro'
          : 'Hãy cho phép truy cập micro'
      );
      return;
    }

    if (errorCode === 'audio-capture') {
      setStatus('Không tìm thấy micro','error');
      toast('Hãy kiểm tra micro điện thoại');
      return;
    }

    if (errorCode === 'network') {
      setStatus('Lỗi mạng nhận dạng','error');
      toast('Kiểm tra kết nối Internet');
      return;
    }

    if (errorCode !== 'aborted') {
      setStatus('Không nhận dạng được','error');
      toast('Hãy bấm micro và nói lại');
    }
  };

  session.onend = async () => {
    if (id !== recognitionId || finished) return;

    finished = true;
    recognition = null;
    activeLanguage = null;
    resetMicUI();

    const sentence = finalText.trim();

    if (!sentence) {
      // Không dịch kết quả tạm chưa xác nhận.
      target.value = previousText;
      stats();

      if (!errorCode) {
        setStatus('Chưa có câu hoàn chỉnh');
      }

      if (automatic) {
        toast('Bấm Speak English nếu muốn nói lại');
      }
      return;
    }

    // CHỈ MỘT CÂU MỚI ĐƯỢC DỊCH.
    // Không gửi lại toàn bộ lịch sử.
    const clean = capitalize(sentence);

    if (isVI) {
      // Lưu trạng thái trước khi nhận câu mới,
      // để có thể phục hồi khi xóa.
      undoStack.push(previousText);
      if (undoStack.length > 40) undoStack.shift();
      $('undoVi').disabled = false;
    }

    setText(language,clean);

    await translateTurn(language,clean);
  };

  try {
    setStatus(
      automatic
        ? 'Đang tự bật nghe English...'
        : 'Đang mở micro...',
      'work'
    );

    session.start();

  } catch(error) {
    if (id !== recognitionId) return;

    recognition = null;
    activeLanguage = null;
    resetMicUI();

    setStatus('Không mở được micro','error');

    toast(
      automatic
        ? 'Hãy bấm Speak English để tiếp tục'
        : 'Hãy bấm micro để thử lại'
    );
  }
}

// ========================================
// 11. NÚT MICRO
// ========================================

viMic.onclick = () => {
  if (activeLanguage === 'vi') {
    finishSpeaking();
    return;
  }

  startRecognition('vi',false);
};

enMic.onclick = () => {
  if (activeLanguage === 'en') {
    finishSpeaking();
    return;
  }

  startRecognition('en',false);
};

// ========================================
// 12. CHỈNH SỬA TIẾNG VIỆT
// ========================================

function rememberVI() {
  undoStack.push(viText.value);

  if (undoStack.length > 40) {
    undoStack.shift();
  }

  $('undoVi').disabled = false;
}

function scheduleEditTranslation(language) {
  cancelTranslation();

  if (language === 'vi') {
    englishReady = false;
    setText('en','');
  } else {
    setText('vi','');
    englishReady = !!enText.value.trim();
  }

  const source =
    language === 'vi' ? viText : enText;

  if (!source.value.trim()) {
    setStatus('Sẵn sàng');
    return;
  }

  setStatus('Đang chuẩn bị dịch...','work');

  translationTimer = setTimeout(() => {
    translateTurn(language,source.value);
  },CONFIG.editDelay);
}

function beforeEdit() {
  stopRecognition();
  cancelSpeaker();
}

$('deleteWord').onclick = () => {
  beforeEdit();

  const old = viText.value.trimEnd();
  if (!old) return;

  rememberVI();

  const updated = old
    .replace(/\S+$/u,'')
    .trimEnd();

  setText('vi',updated);
  scheduleEditTranslation('vi');

  toast('Đã xóa 1 từ');
};

$('clearVi').onclick = () => {
  beforeEdit();

  if (!viText.value) return;

  rememberVI();

  setText('vi','');
  scheduleEditTranslation('vi');

  toast('Đã xóa tiếng Việt');
};

$('undoVi').onclick = () => {
  beforeEdit();

  if (!undoStack.length) return;

  const restored = undoStack.pop();

  setText('vi',restored);
  $('undoVi').disabled = undoStack.length === 0;

  scheduleEditTranslation('vi');
  toast('Đã phục hồi');
};

// Sửa bằng bàn phím cũng tự dịch lại.

viText.addEventListener('input',() => {
  beforeEdit();
  saveTexts();
  scheduleEditTranslation('vi');
});

enText.addEventListener('input',() => {
  beforeEdit();
  saveTexts();

  // English được sửa bằng tay:
  // cho phép phát bản tiếng Anh mới.
  scheduleEditTranslation('en');
});

// ========================================
// 13. CỠ CHỮ
// ========================================

function applyFont() {
  viText.style.fontSize = fontSize + 'px';
  enText.style.fontSize = fontSize + 'px';
  store(KEYS.font,fontSize);
}

$('fontUp').onclick = () => {
  fontSize = Math.min(36,fontSize+2);
  applyFont();
};

$('fontDown').onclick = () => {
  fontSize = Math.max(16,fontSize-2);
  applyFont();
};

// ========================================
// 14. CHẾ ĐỘ SÁNG TỐI
// ========================================

$('theme').onclick = () => {
  document.body.classList.toggle('dark');
  store(
    KEYS.theme,
    document.body.classList.contains('dark')
      ? 'dark' : 'light'
  );
};

// ========================================
// 15. KHỞI TẠO
// ========================================

function initialize() {
  viText.value = load(KEYS.vi,'');
  enText.value = load(KEYS.en,'');

  const savedFont = Number(load(KEYS.font,23));

  if (
    Number.isFinite(savedFont) &&
    savedFont >= 16 &&
    savedFont <= 36
  ) {
    fontSize = savedFont;
  }

  if (load(KEYS.theme,'light') === 'dark') {
    document.body.classList.add('dark');
  }

  // Nội dung tiếng Anh đã lưu có thể là
  // bản dịch cũ, không tự cho phát ngay.
  englishReady = false;

  applyFont();
  saveTexts();
  updateConnection();
  resetMicUI();

  if (!Recognition) {
    setStatus('Không hỗ trợ nhận dạng','error');
    viMic.disabled = true;
    enMic.disabled = true;
    return;
  }

  if (!window.isSecureContext) {
    setStatus('Website cần HTTPS','error');
    return;
  }

  setStatus('Sẵn sàng');
}

initialize();

// ========================================
// 16. KHI ĐÓNG TRANG
// ========================================

window.addEventListener('pagehide',() => {
  stopRecognition();
  cancelSpeaker();
  cancelTranslation();
  saveTexts();
});

</script>
