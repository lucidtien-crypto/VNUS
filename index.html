<style>
:root{--bg:#f7f8fa;--panel:#fff;--field:#fbfcfe;--ink:#243044;--sub:#748294;--line:#e0e7ef;--green:#087e62;--greenbg:#e8f7ef;--blue:#2863b8;--bluebg:#eef4ff;--red:#d34848}
body.dark{--bg:#141a21;--panel:#1e2630;--field:#242f3b;--ink:#edf2f8;--sub:#adbac8;--line:#3b4858;--greenbg:#153b30;--bluebg:#1b3454}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:max(10px,env(safe-area-inset-top)) max(9px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(9px,env(safe-area-inset-left))}button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #7bb2e5;outline-offset:2px}
.app{max-width:850px;margin:auto;display:grid;gap:10px}header{min-height:48px;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:var(--green);color:white;font-size:23px}h1{margin:0;font-size:clamp(17px,3.5vw,22px);letter-spacing:-.4px}.top-actions{display:flex;gap:5px;align-items:center}.top-btn{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0 9px;font-size:13px;font-weight:650}.count{color:var(--green)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--sub);font-size:12px;padding:1px 3px}.status-main{display:flex;align-items:center;gap:7px}.dot{height:8px;width:8px;border-radius:50%;background:#21a17d;flex-shrink:0}.dot.listen{background:#e15353;animation:pulse 1.4s infinite}.dot.work{background:#d4a039;animation:pulse 1.8s infinite}.dot.error{background:#e15353}@keyframes pulse{50%{opacity:.35}}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:13px;display:grid;gap:10px}.panel.vi-active{border-color:#36a886}.panel.en-active{border-color:#6a9add}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:40px}.panel-title{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:750}.muted{color:var(--sub);font-size:12px}textarea.maintext{width:100%;min-height:155px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--field);color:var(--ink);font-size:23px;line-height:1.6}textarea::placeholder{color:var(--sub);opacity:.8}.tools{display:grid;grid-template-columns:minmax(106px,1.65fr) repeat(3,minmax(55px,1fr));gap:6px}.tool{min-height:58px;padding:7px 4px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:650}.tool .symbol{font-size:19px;line-height:1.1}.tool .word{font-size:11px;text-align:center}.tool.micvi{background:var(--greenbg);color:var(--green);border-color:#a4d4c3}.tool.micen{display:flex;flex-direction:row;gap:10px;padding:10px 14px;background:var(--bluebg);color:var(--blue);border-color:#b5cbe9}.tool.micen .word{font-size:14px}.tool.recording{background:var(--red)!important;color:white!important;border-color:var(--red)!important}.tool.danger{color:var(--red)}.speaker{width:41px;height:41px;border:1px solid #a7d3c1;border-radius:11px;color:var(--green);background:var(--greenbg);display:grid;place-items:center;font-size:23px}.speaker.playing{background:var(--green);color:white;animation:pulse 1.5s infinite}.en-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px}.footer{color:var(--sub);font-size:11px;display:flex;justify-content:space-between;padding:3px}
[hidden]{display:none!important}.overlay[hidden]{display:none}.overlay{position:fixed;inset:0;z-index:40;background:#101b2b8c;display:flex;align-items:center;justify-content:center;padding:12px}.modal{background:var(--panel);width:min(100%,700px);max-height:92dvh;overflow:auto;border-radius:17px;padding:16px;color:var(--ink);box-shadow:0 16px 55px #0004}.modal-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.modal-title h2{margin:0;font-size:19px}.secondary{border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);padding:9px 12px;font-size:13px;font-weight:650}.primary{background:var(--green);color:white;border:1px solid var(--green);border-radius:10px;padding:10px 13px;font-weight:700}.auth-box{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:12px}.auth-box p{margin:0 0 9px;font-size:13px;color:var(--sub)}.auth-form{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.auth-form input,.search,.edit-field{min-width:0;width:100%;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--ink);padding:10px;font-size:14px}.search{margin-bottom:9px}.memory-meta{font-size:12px;color:var(--sub);margin:0 0 8px}.memory-list{display:grid;gap:7px;max-height:44dvh;overflow:auto}.memory-item{border:1px solid var(--line);border-radius:11px;padding:11px;display:grid;gap:6px}.memory-item strong{font-size:14px;overflow-wrap:anywhere}.memory-item .translated{font-size:14px;color:var(--green);overflow-wrap:anywhere}.memory-item .pair{font-size:11px;color:var(--sub)}.memory-actions{display:flex;gap:7px;flex-wrap:wrap}.memory-actions button{padding:6px 11px}.edit-field{min-height:65px;resize:vertical}.bottom-actions{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:12px;flex-wrap:wrap}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,12px);background:#27394b;color:white;padding:11px 15px;border-radius:11px;max-width:90vw;text-align:center;font-size:13px;opacity:0;transition:.18s;pointer-events:none;z-index:70}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:550px){.panel{padding:10px;gap:9px}.tools{gap:5px}.tool .word{font-size:10px}.panel-title{font-size:16px}.auth-form{grid-template-columns:1fr}.modal{padding:12px}textarea.maintext{min-height:148px}.top-btn{padding:0 7px;font-size:12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header><div class="brand"><div class="logo" aria-hidden="true">♬</div><h1>Voice Translator</h1></div><div class="top-actions"><button class="top-btn" id="memoryBtn">Bộ nhớ <span class="count" id="memoryCount">0</span></button><button class="top-btn" id="fontDown">A−</button><button class="top-btn" id="fontUp">A+</button><button class="top-btn" id="theme" aria-label="Sáng tối">◐</button></div></header>
<div class="status" role="status" aria-live="polite"><div class="status-main"><span id="dot" class="dot"></span><span id="statusText">Sẵn sàng</span></div><span id="network">Online</span></div>
<section class="panel" id="viPanel"><div class="panel-head"><div class="panel-title">Tiếng Việt</div><span class="muted" id="viNote">Vietnamese</span></div><textarea class="maintext" id="viText" spellcheck="true" placeholder="Nói tiếng Việt tại đây..."></textarea><div class="tools"><button class="tool micvi" id="viMic"><span class="symbol" id="viIcon">🎙</span><span class="word" id="viLabel">Nói tiếng Việt</span></button><button class="tool" id="deleteWord"><span class="symbol">⌫</span><span class="word">Xóa 1 từ</span></button><button class="tool danger" id="clearVi"><span class="symbol">✕</span><span class="word">Xóa hết</span></button><button class="tool" id="undoVi" disabled><span class="symbol">↶</span><span class="word">Phục hồi</span></button></div></section>
<section class="panel" id="enPanel"><div class="panel-head"><div class="panel-title"><button class="speaker" id="speaker" aria-label="Phát tiếng Anh rồi nghe khách">🔊</button><span>English (US)</span></div><span class="muted" id="enNote">American English</span></div><textarea class="maintext" id="enText" spellcheck="true" placeholder="English translation appears here..."></textarea><div class="en-bottom"><button class="tool micen" id="enMic"><span class="symbol" id="enIcon">🎙</span><span class="word" id="enLabel">Speak English</span></button><span class="muted">English → Vietnamese</span></div></section>
<div class="footer"><span id="stats">0 từ · 0 ký tự</span><span>VI ↔ EN (US)</span></div>
</main>
<div class="overlay" id="overlay" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-title"><h2 id="modalTitle">Bộ nhớ dịch</h2><button class="secondary" id="closeModal">Đóng ✕</button></div><div class="auth-box"><p id="cloudStatus">Firebase chưa cấu hình — vẫn lưu trên điện thoại.</p><form id="loginForm" class="auth-form" hidden><input id="loginEmail" type="email" autocomplete="username" placeholder="Email Firebase" required><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Mật khẩu Firebase" required><button class="primary" type="submit">Đăng nhập</button></form><button class="secondary" id="logoutBtn" hidden>Đăng xuất Firebase</button></div><input class="search" id="cacheSearch" placeholder="Tìm câu tiếng Việt hoặc English..." aria-label="Tìm bản dịch"><p class="memory-meta" id="memoryMeta">0 câu đã lưu</p><div class="memory-list" id="memoryList"></div><div class="bottom-actions"><button class="secondary" id="showMore" hidden>Hiện thêm</button><button class="secondary" id="clearCache">Xóa toàn bộ bộ nhớ</button></div></section></div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';
// 1) THAY BỐN GIÁ TRỊ FIREBASE bên dưới từ Firebase Console.
// Firebase web config KHÔNG phải mật khẩu đăng nhập.
window.FIREBASE_CONFIG = {
   apiKey: "AIzaSyA3ThONM6MLyzqSCS-bwNAZLV4yHL14HyY",
  authDomain: "voicetranslator-507df.firebaseapp.com",
  projectId: "voicetranslator-507df",
  appId: "1:471990111889:web:0cef6de9c5d0f1eeedf930"
};
const SETTINGS={
  emailMyMemory:'lucid.tien11202026@gmail.com',
  maxCache:1000,maxRequestChars:450,editDelay:800,
  speakerCooldown:650,requestTimeout:12000
};
const $=id=>document.getElementById(id);
const viText=$('viText'),enText=$('enText');
const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const STORE={cache:'vt_cache_cloud_v5',pending:'vt_pending_cloud_v5',vi:'vt_vi_v5',en:'vt_en_v5',font:'vt_font_v5',theme:'vt_theme_v5'};
const save=(key,val)=>{try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}};
const read=(key,fallback)=>{try{let v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v);}catch(e){return fallback;}};
let fontSize=Number(read(STORE.font,23))||23;
let cache=new Map(),pending=new Map(),undo=[];
let recognize=null,recognitionId=0,activeLang=null;
let utterance=null,speaking=false,autoTimer=null,editTimer=null,toastTimer=null;
let translateId=0,controller=null,translationPending=false;
let englishReady=false,visibleCount=30;

function status(message,mode='ready'){$('statusText').textContent=message;$('dot').className='dot'+(mode==='ready'?'':' '+mode);}
function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2900);}
function stats(){const t=viText.value.trim();$('stats').textContent=`${t?t.split(/\s+/u).length:0} từ · ${viText.value.length} ký tự`;}
function persistText(){save(STORE.vi,viText.value);save(STORE.en,enText.value);stats();}
function normalize(text){return String(text).normalize('NFC').trim().toLocaleLowerCase().replace(/\s+/gu,' ').replace(/[.!?。！？]+$/gu,'').trim();}
function keyFor(from,to,source){return JSON.stringify([from,to,normalize(source)]);}
function validEntry(e){return e&&['vi','en'].includes(e.from)&&['vi','en'].includes(e.to)&&e.from!==e.to&&typeof e.source==='string'&&typeof e.translation==='string'&&e.source.trim()&&e.translation.trim()&&e.source.length<=450&&e.translation.length<=2000&&Number.isFinite(e.updatedAt);}
function persistCache(){try{localStorage.setItem(STORE.cache,JSON.stringify([...cache.values()]));}catch(e){toast('Bộ nhớ máy đã đầy');}updateCount();}
function persistPending(){save(STORE.pending,[...pending]);}
function updateCount(){$('memoryCount').textContent=cache.size;if(!$('overlay').hidden)renderMemory();}
function queue(key,op){pending.set(key,op);persistPending();window.voiceCloud?.schedule?.();}
function trimCache(){while(cache.size>SETTINGS.maxCache){const oldest=cache.keys().next().value;const old=cache.get(oldest);cache.delete(oldest);queue(oldest,{kind:'delete',from:old.from,to:old.to,source:old.source,updatedAt:Date.now()});}}
function putEntry(entry,remote=true){const k=keyFor(entry.from,entry.to,entry.source);cache.delete(k);cache.set(k,entry);if(remote)queue(k,{kind:'put',entry,updatedAt:entry.updatedAt});trimCache();persistCache();}
function saveTranslation(from,to,source,translation){putEntry({from,to,source:source.trim(),translation:translation.trim(),updatedAt:Date.now()});}
function getCached(from,to,source){const k=keyFor(from,to,source),e=cache.get(k);if(!e)return null;cache.delete(k);cache.set(k,e);persistCache();return e.translation;}
function deleteEntry(k){const e=cache.get(k);if(!e)return;cache.delete(k);queue(k,{kind:'delete',from:e.from,to:e.to,source:e.source,updatedAt:Date.now()});persistCache();}
function bootstrapCache(){
  const arr=read(STORE.cache,[]);
  if(Array.isArray(arr))for(const e of arr){if(validEntry(e))cache.set(keyFor(e.from,e.to,e.source),e);}
  // Tự nhập bộ nhớ của hai phiên bản HTML trước nếu có.
  if(!cache.size){
    const old=read('voice_smart_cache_v4',[]);
    if(Array.isArray(old))for(const item of old){
      try{
        const [k,translation]=item;
        const [from,to,source]=JSON.parse(k);
        const e={from,to,source,translation,updatedAt:Date.now()};
        if(validEntry(e))cache.set(keyFor(from,to,source),e);
      }catch(error){}
    }
    if(!cache.size){
      const legacy=read('voice_cache_v3',{});
      if(legacy&&typeof legacy==='object')for(const [k,translation] of Object.entries(legacy)){
        const [from,to,...rest]=k.split('|');
        const source=rest.join('|');
        const e={from,to,source,translation,updatedAt:Date.now()};
        if(validEntry(e))cache.set(keyFor(from,to,source),e);
      }
    }
  }
  const q=read(STORE.pending,[]);
  if(Array.isArray(q))for(const [k,op] of q){if(typeof k==='string'&&op&&['put','delete'].includes(op.kind))pending.set(k,op);}
  trimCache();persistCache();
}
bootstrapCache();

// Firebase sẽ gọi các hàm này sau khi người dùng đăng nhập.
window.voiceApp={
 pendingSnapshot:()=>[...pending],
 ack:(key,op)=>{const now=pending.get(key);if(now&&now.updatedAt===op.updatedAt&&now.kind===op.kind){pending.delete(key);persistPending();}},
 merge:(remoteEntries,firstSync)=>{const seen=new Set();for(const e of remoteEntries){if(!validEntry(e))continue;const k=keyFor(e.from,e.to,e.source);seen.add(k);if(pending.has(k))continue;const old=cache.get(k);if(!old||old.updatedAt<e.updatedAt){cache.delete(k);cache.set(k,e);}}for(const [k,e] of [...cache]){if(!seen.has(k)&&!pending.has(k)){if(firstSync)pending.set(k,{kind:'put',entry:e,updatedAt:e.updatedAt});else cache.delete(k);}}trimCache();persistCache();persistPending();},
 cloudUI:(message,loggedIn=false)=>{$('cloudStatus').textContent=message;$('loginForm').hidden=loggedIn;$('logoutBtn').hidden=!loggedIn;}
};

function cancelTranslate(){translateId++;clearTimeout(editTimer);if(controller){controller.abort();controller=null;}translationPending=false;}
function decodeHtml(text){const t=document.createElement('textarea');t.innerHTML=text;return t.value;}
async function translateText(text,from,to,signal){const source=text.trim();if(!source)return '';if(source.length>SETTINGS.maxRequestChars)throw Error('Câu quá dài, hãy chia ngắn hơn 450 ký tự.');const hit=getCached(from,to,source);if(hit!==null)return hit;if(!navigator.onLine)throw Error('Chưa có bản dịch lưu và đang mất mạng.');const url=new URL('https://api.mymemory.translated.net/get');url.searchParams.set('q',source);url.searchParams.set('langpair',`${from}|${to}`);url.searchParams.set('de',SETTINGS.emailMyMemory);const response=await fetch(url,{signal,cache:'no-store'});if(!response.ok)throw Error('Máy chủ dịch lỗi '+response.status);const data=await response.json();if(data.quotaFinished===true)throw Error('Đã hết hạn mức MyMemory hôm nay.');if(Number(data.responseStatus)!==200)throw Error(data.responseDetails||'Dịch vụ từ chối yêu cầu.');const translated=decodeHtml(data.responseData?.translatedText||'').trim();if(!translated||/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(translated))throw Error('Dịch vụ không trả về bản dịch hợp lệ.');saveTranslation(from,to,source,translated);return translated;}
async function translateTurn(from,source){cancelTranslate();const id=translateId,wasVI=from==='vi',target=wasVI?enText:viText;target.value='';if(wasVI)englishReady=false;persistText();if(!source.trim()){status('Sẵn sàng');return;}translationPending=true;const abort=new AbortController();controller=abort;const timeout=setTimeout(()=>abort.abort(),SETTINGS.requestTimeout);status(wasVI?'Đang dịch sang tiếng Anh...':'Translating to Vietnamese...','work');try{const result=await translateText(source,from,wasVI?'en':'vi',abort.signal);if(id!==translateId)return;target.value=result;englishReady=wasVI;persistText();status(wasVI?'Đã dịch · Bấm loa để phát':'Đã dịch · Đọc tiếng Việt');}catch(e){if(id!==translateId)return;status('Không dịch được','error');toast(e.name==='AbortError'?'Dịch quá thời gian chờ':e.message);}finally{clearTimeout(timeout);if(id===translateId){controller=null;translationPending=false;}}}
function scheduleEdit(from){cancelTranslate();if(from==='vi'){englishReady=false;enText.value='';}else{viText.value='';englishReady=true;}persistText();const text=(from==='vi'?viText:enText).value;if(!text.trim()){status('Sẵn sàng');return;}status('Chờ dịch...','work');editTimer=setTimeout(()=>translateTurn(from,text),SETTINGS.editDelay);}

function cancelAuto(){clearTimeout(autoTimer);autoTimer=null;}
function stopSpeaker(){cancelAuto();utterance=null;speaking=false;if('speechSynthesis'in window)speechSynthesis.cancel();$('speaker').classList.remove('playing');}
function stopRecognition(){cancelAuto();recognitionId++;const old=recognize;recognize=null;activeLang=null;if(old)try{old.abort();}catch(e){}resetMicUI();}
function micUI(from,on){const button=$(from==='vi'?'viMic':'enMic');button.classList.toggle('recording',on);$(from==='vi'?'viIcon':'enIcon').textContent=on?'■':'🎙';$(from==='vi'?'viLabel':'enLabel').textContent=on?(from==='vi'?'Dừng nói':'Stop Listening'):(from==='vi'?'Nói tiếng Việt':'Speak English');$('viPanel').classList.toggle('vi-active',on&&from==='vi');$('enPanel').classList.toggle('en-active',on&&from==='en');}
function resetMicUI(){micUI('vi',false);micUI('en',false);}
function startRecognition(from,automatic=false){if(!Recognition){toast('Trình duyệt không hỗ trợ nhận dạng giọng nói.');return;}stopSpeaker();stopRecognition();cancelTranslate();const id=recognitionId,wasVI=from==='vi',target=wasVI?viText:enText,previous=target.value;const session=new Recognition();recognize=session;activeLang=from;session.lang=wasVI?'vi-VN':'en-US';session.continuous=false;session.interimResults=true;session.maxAlternatives=1;let finalText='',interim='',error=null,ended=false;session.onstart=()=>{if(id!==recognitionId){try{session.abort();}catch(e){}return;}micUI(from,true);status(wasVI?'Đang nghe tiếng Việt...':'Listening to English...','listen');};session.onresult=e=>{if(id!==recognitionId)return;finalText='';interim='';for(let i=0;i<e.results.length;i++){const p=e.results[i][0]?.transcript?.trim()||'';if(!p)continue;if(e.results[i].isFinal)finalText+=(finalText?' ':'')+p;else interim+=(interim?' ':'')+p;}target.value=[finalText,interim].filter(Boolean).join(' ');stats();target.scrollTop=target.scrollHeight;};session.onerror=e=>{if(id!==recognitionId)return;error=e.error;const messages={'not-allowed':'Micro bị chặn. Bấm micro và cấp quyền.','service-not-allowed':'iPhone không cho tự bật micro. Bấm Speak English.','network':'Nhận dạng cần Internet.','audio-capture':'Không tìm thấy micro.','no-speech':'Chưa nghe thấy người nói.'};status(messages[error]||'Không nhận dạng được','error');if(error!=='no-speech')toast(messages[error]||'Hãy nói lại.');};session.onend=()=>{if(id!==recognitionId||ended)return;ended=true;recognize=null;activeLang=null;resetMicUI();if(!finalText.trim()){target.value=previous;stats();if(!error)status('Chưa nhận được câu hoàn chỉnh');if(automatic)toast('Bấm Speak English nếu cần thử lại.');return;}if(wasVI){undo.push(previous);if(undo.length>40)undo.shift();$('undoVi').disabled=false;}target.value=finalText.trim();persistText();translateTurn(from,target.value);};try{status(automatic?'Đang tự mở micro tiếng Anh...':'Đang mở micro...','work');session.start();}catch(e){if(id!==recognitionId)return;recognize=null;activeLang=null;resetMicUI();status('Không mở được micro','error');toast(automatic?'Hãy bấm Speak English để nghe khách.':'Hãy thử bấm micro lần nữa.');}}
function stopGraceful(){if(!recognize)return;status('Đang hoàn tất câu...','work');try{recognize.stop();}catch(e){stopRecognition();}}
$('viMic').onclick=()=>{if(activeLang==='vi')stopGraceful();else startRecognition('vi');};
$('enMic').onclick=()=>{if(activeLang==='en')stopGraceful();else startRecognition('en');};
function speakEnglish(){if(!('speechSynthesis'in window)){toast('Không hỗ trợ loa phát giọng nói.');return;}if(speaking){stopSpeaker();status('Đã dừng phát');return;}if(translationPending||!englishReady||!enText.value.trim()){toast('Bản tiếng Anh chưa sẵn sàng.');return;}stopRecognition();stopSpeaker();const u=new SpeechSynthesisUtterance(enText.value.trim());u.lang='en-US';u.rate=.94;u.volume=1;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang.toLowerCase()==='en-us')||voices.find(v=>v.lang.toLowerCase().startsWith('en'))||null;utterance=u;speaking=true;let started=false;u.onstart=()=>{if(utterance!==u)return;started=true;$('speaker').classList.add('playing');status('Speaking English...','work');};u.onend=()=>{if(utterance!==u)return;utterance=null;speaking=false;$('speaker').classList.remove('playing');if(!started){status('Đã phát xong');return;}status('Chuẩn bị nghe khách...','work');autoTimer=setTimeout(()=>{autoTimer=null;if(!recognize&&!speaking)startRecognition('en',true);},SETTINGS.speakerCooldown);};u.onerror=()=>{if(utterance!==u)return;stopSpeaker();status('Không phát được tiếng Anh','error');toast('Kiểm tra loa điện thoại.');};try{speechSynthesis.cancel();speechSynthesis.speak(u);status('Đang chuẩn bị phát...','work');}catch(e){stopSpeaker();toast('Không phát được tiếng Anh.');}}
$('speaker').onclick=speakEnglish;
function beforeEdit(){stopRecognition();stopSpeaker();}
function rememberVI(){undo.push(viText.value);if(undo.length>40)undo.shift();$('undoVi').disabled=false;}
$('deleteWord').onclick=()=>{beforeEdit();const t=viText.value.trimEnd();if(!t)return;rememberVI();viText.value=t.replace(/\S+$/u,'').trimEnd();scheduleEdit('vi');};
$('clearVi').onclick=()=>{beforeEdit();if(!viText.value)return;rememberVI();viText.value='';scheduleEdit('vi');};
$('undoVi').onclick=()=>{beforeEdit();if(!undo.length)return;viText.value=undo.pop();$('undoVi').disabled=undo.length===0;scheduleEdit('vi');};
viText.addEventListener('input',()=>{beforeEdit();scheduleEdit('vi');});
enText.addEventListener('input',()=>{beforeEdit();scheduleEdit('en');});
function applyFont(){viText.style.fontSize=fontSize+'px';enText.style.fontSize=fontSize+'px';save(STORE.font,fontSize);}
$('fontUp').onclick=()=>{fontSize=Math.min(36,fontSize+2);applyFont();};
$('fontDown').onclick=()=>{fontSize=Math.max(16,fontSize-2);applyFont();};
$('theme').onclick=()=>{document.body.classList.toggle('dark');save(STORE.theme,document.body.classList.contains('dark'));};
function init(){viText.value=read(STORE.vi,'');enText.value=read(STORE.en,'');if(read(STORE.theme,false))document.body.classList.add('dark');applyFont();stats();resetMicUI();$('network').textContent=navigator.onLine?'Online':'Offline';if(!Recognition){$('viMic').disabled=true;$('enMic').disabled=true;status('Trình duyệt chưa hỗ trợ micro','error');}else if(!window.isSecureContext)status('Cần HTTPS để dùng micro','error');else status('Sẵn sàng');}init();
window.addEventListener('online',()=>{$('network').textContent='Online';window.voiceCloud?.schedule?.();});window.addEventListener('offline',()=>{$('network').textContent='Offline';});
window.addEventListener('pagehide',()=>{stopRecognition();stopSpeaker();cancelTranslate();persistText();});

// 3) BỘ NHỚ: QUẢN LÝ TRỰC TIẾP TRÊN ĐIỆN THOẠI.
function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
function openMemory(){cancelAuto();$('overlay').hidden=false;visibleCount=30;renderMemory();$('cacheSearch').focus();}
function closeMemory(){$('overlay').hidden=true;}
$('memoryBtn').onclick=openMemory;$('closeModal').onclick=closeMemory;
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeMemory();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('overlay').hidden)closeMemory();});
$('cacheSearch').addEventListener('input',()=>{visibleCount=30;renderMemory();});
$('showMore').onclick=()=>{visibleCount+=30;renderMemory();};
function renderMemory(){if($('overlay').hidden)return;const needle=normalize($('cacheSearch').value);const records=[...cache.entries()].reverse().filter(([k,e])=>!needle||normalize(e.source+' '+e.translation).includes(needle));$('memoryMeta').textContent=`${cache.size}/1000 câu lưu · ${records.length} kết quả`;const parent=$('memoryList');parent.replaceChildren();for(const [k,e] of records.slice(0,visibleCount)){const card=element('div','memory-item');card.append(element('div','pair',`${e.from.toUpperCase()} → ${e.to.toUpperCase()}`),element('strong','',e.source),element('div','translated',e.translation));const actions=element('div','memory-actions');const edit=element('button','secondary','Sửa bản dịch'),del=element('button','secondary','Xóa');edit.onclick=()=>{const area=element('textarea','edit-field');area.value=e.translation;const saveBtn=element('button','primary','Lưu sửa'),cancelBtn=element('button','secondary','Hủy');actions.replaceChildren(area,saveBtn,cancelBtn);saveBtn.onclick=()=>{const t=area.value.trim();if(!t){toast('Bản dịch không được để trống');return;}if(t.length>2000){toast('Bản dịch quá dài');return;}putEntry({...e,translation:t,updatedAt:Date.now()});if(e.from==='vi'&&normalize(viText.value)===normalize(e.source)){enText.value=t;englishReady=true;persistText();}if(e.from==='en'&&normalize(enText.value)===normalize(e.source)){viText.value=t;persistText();}toast('Đã sửa và chờ đồng bộ Firebase');};cancelBtn.onclick=renderMemory;area.focus();};del.onclick=()=>{if(!confirm('Xóa bản dịch này khỏi máy và Firebase?'))return;deleteEntry(k);};actions.append(edit,del);card.append(actions);parent.append(card);}if(!records.length)parent.append(element('p','muted','Không có câu dịch phù hợp.'));$('showMore').hidden=records.length<=visibleCount;}
$('clearCache').onclick=()=>{
  if(!cache.size)return;
  if(!confirm('Xóa toàn bộ các bản dịch đã lưu trên máy và Firebase?'))return;
  const now=Date.now();
  for(const [k,e] of cache)pending.set(k,{kind:'delete',from:e.from,to:e.to,source:e.source,updatedAt:now});
  cache.clear();persistPending();persistCache();
  window.voiceCloud?.schedule?.();
  toast('Đã xóa trên máy, đang chờ đồng bộ Firebase.');
};
</script>
<script type="module">
// 4) FIREBASE: chỉ tải khi bạn đã dán cấu hình đúng.
const cfg=window.FIREBASE_CONFIG;
if(cfg.apiKey&&!cfg.apiKey.startsWith('DAN_')&&cfg.projectId!=='TEN_DU_AN'&&cfg.appId&&!cfg.appId.startsWith('DAN_')){
  try{
    const VERSION='13.4.0';
    const [{initializeApp},{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut},{getFirestore,collection,doc,getDocs,setDoc,updateDoc,FieldPath,deleteField}]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${VERSION}/firebase-auth.js`),
      import(`https://www.gstatic.com/firebasejs/${VERSION}/firebase-firestore-lite.js`)
    ]);
    const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);
    let currentUser=null,initialLoaded=false,flushing=false,flushTimer=null;
    const voice=window.voiceApp;
    const msg=(text,loggedIn=!!currentUser)=>voice.cloudUI(text,loggedIn);
    async function sha256(text){const bytes=new TextEncoder().encode(text);const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');}
    function schedule(){clearTimeout(flushTimer);flushTimer=setTimeout(flush,700);}
    async function loadRemote(){if(!currentUser)return;initialLoaded=false;msg('Đang tải bộ nhớ Firebase...');const snap=await getDocs(collection(db,'users',currentUser.uid,'cache'));const entries=[];snap.forEach(d=>{const obj=d.data()?.entries||{};for(const record of Object.values(obj)){if(record&&typeof record==='object')entries.push(record);}});const syncMark=`vt_synced_${cfg.projectId}_${currentUser.uid}`;const firstSync=localStorage.getItem(syncMark)!=='yes';voice.merge(entries,firstSync);localStorage.setItem(syncMark,'yes');initialLoaded=true;msg(`Đã tải bộ nhớ Firebase. ${entries.length} mục trên đám mây.`);}
    async function flush(){if(flushing||!initialLoaded||!currentUser||!navigator.onLine)return;flushing=true;let ok=false;try{const ops=voice.pendingSnapshot();if(!ops.length){ok=true;return;}const userId=currentUser.uid;const buckets=new Map();for(const [key,op] of ops){const hash=await sha256(key),bucket=hash[0];if(!buckets.has(bucket))buckets.set(bucket,{puts:{},deletes:[],acks:[]});const group=buckets.get(bucket);if(op.kind==='put')group.puts[hash]=op.entry;else group.deletes.push(hash);group.acks.push([key,op]);}for(const [bucket,group] of buckets){if(!currentUser||currentUser.uid!==userId)break;const ref=doc(db,'users',userId,'cache',bucket);const puts=Object.keys(group.puts);if(puts.length)await setDoc(ref,{entries:group.puts},{merge:true});if(group.deletes.length){const args=[];for(const hash of group.deletes)args.push(new FieldPath('entries',hash),deleteField());try{await updateDoc(ref,...args);}catch(e){if(e.code!=='not-found')throw e;}}for(const [key,op] of group.acks)voice.ack(key,op);}ok=true;msg('Đã đồng bộ bộ nhớ Firebase.');}catch(e){msg('Chưa đồng bộ được: '+(e.code||e.message));}finally{flushing=false;if(ok&&voice.pendingSnapshot().length)schedule();}}
    window.voiceCloud={schedule};
    document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;msg('Đang đăng nhập Firebase...',false);try{await signInWithEmailAndPassword(auth,email,password);document.getElementById('loginPassword').value='';}catch(err){msg('Đăng nhập không thành công: '+(err.code||err.message),false);}});
    document.getElementById('logoutBtn').onclick=async()=>{await signOut(auth);};
    onAuthStateChanged(auth,async user=>{currentUser=user;initialLoaded=false;if(!user){msg('Chưa đăng nhập Firebase. Bộ nhớ vẫn lưu trên điện thoại.',false);return;}try{await loadRemote();schedule();}catch(e){msg('Không tải được Firebase: '+(e.code||e.message));}});
    msg('Đang kiểm tra tài khoản Firebase...',false);
  }catch(e){window.voiceApp.cloudUI('Không tải được Firebase SDK. Website vẫn lưu cục bộ: '+e.message,false);}
}else{
  window.voiceApp.cloudUI('Firebase chưa cấu hình. Bộ nhớ trên điện thoại vẫn dùng được.',false);
}
</script>
