
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F8FA">
<title>Voice Translator · VI / EN</title>

<style>
:root {
  --bg:#F7F8FA;
  --card:#FFFFFF;
  --field:#FBFCFE;
  --text:#202B3B;
  --muted:#778397;
  --border:#E1E7EE;
  --green:#087F65;
  --green-bg:#E9F8F1;
  --blue:#285FB0;
  --blue-bg:#EDF4FF;
  --red:#D54B4B;
  --shadow:0 8px 28px rgba(25,42,68,.045);
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100svh;
  padding:
    max(12px,env(safe-area-inset-top))
    max(10px,env(safe-area-inset-right))
    max(24px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
    "Segoe UI",Roboto,Arial,sans-serif;
}

body.dark {
  --bg:#13171D;
  --card:#1D242D;
  --field:#222B36;
  --text:#F2F5F9;
  --muted:#A7B2C2;
  --border:#3C4755;
  --green-bg:#153B32;
  --blue-bg:#1C3554;
  --shadow:0 8px 28px rgba(0,0,0,.15);
}

button,textarea { font:inherit; }

button {
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}

button:disabled {
  opacity:.45;
  cursor:not-allowed;
}

button:focus-visible,
textarea:focus-visible {
  outline:3px solid #67B6E8;
  outline-offset:2px;
}

.app {
  width:100%;
  max-width:850px;
  margin:auto;
  display:grid;
  gap:12px;
}

/* HEADER */

.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:48px;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo {
  width:37px;
  height:37px;
  border-radius:12px;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
  flex-shrink:0;
}

.logo svg { width:21px;height:21px; }

.brand h1 {
  margin:0;
  font-size:clamp(17px,3.5vw,22px);
  font-weight:750;
  letter-spacing:-.6px;
}

.header-actions {
  display:flex;
  align-items:center;
  gap:7px;
}

.icon-btn {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:11px;
}

.icon-btn svg {
  width:19px;
  height:19px;
}

.statusbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:24px;
  padding:0 3px;
  font-size:12px;
  color:var(--muted);
}

.status-left {
  display:flex;
  align-items:center;
  gap:7px;
  min-width:0;
}

.dot {
  width:8px;
  height:8px;
  border-radius:50%;
  flex-shrink:0;
  background:#17A477;
}

.dot.listening {
  background:#E65A5A;
  animation:pulse 1.3s infinite;
}

.dot.working {
  background:#E5A12D;
  animation:pulse 1.6s infinite;
}

.dot.error { background:#E65A5A; }

@keyframes pulse {
  50% { opacity:.35;transform:scale(.85); }
}

/* LANGUAGE PANELS */

.panel {
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px;
  display:grid;
  gap:11px;
  box-shadow:var(--shadow);
  transition:border-color .2s,box-shadow .2s;
}

.panel.active {
  border-color:#53B69A;
  box-shadow:0 0 0 3px rgba(8,127,101,.08);
}

.panel.english-active {
  border-color:#79A3DF;
  box-shadow:0 0 0 3px rgba(40,95,176,.08);
}

.panel-head {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:35px;
}

.panel-title {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:17px;
  font-weight:750;
  letter-spacing:-.25px;
}

.speaker {
  width:39px;
  height:39px;
  display:grid;
  place-items:center;
  border:1px solid #B6D9CB;
  border-radius:11px;
  background:var(--green-bg);
  color:var(--green);
  flex-shrink:0;
}

.speaker svg {
  width:21px;
  height:21px;
}

.speaker.playing {
  background:var(--green);
  border-color:var(--green);
  color:white;
  animation:softPulse 1.8s ease-in-out infinite;
}

@keyframes softPulse {
  50% {
    box-shadow:0 0 0 6px rgba(8,127,101,.12);
  }
}

.panel-note {
  color:var(--muted);
  font-size:12px;
  font-weight:500;
  white-space:nowrap;
}

.field {
  display:block;
  width:100%;
  min-height:165px;
  resize:vertical;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--field);
  color:var(--text);
  padding:15px;
  font-size:clamp(20px,4.7vw,25px);
  font-weight:450;
  line-height:1.65;
  outline:none;
  white-space:pre-wrap;
}

.field:focus {
  border-color:#6BB89F;
}

.field::placeholder {
  color:var(--muted);
  opacity:.65;
}

.field.pending {
  opacity:.7;
}

.panel-footer {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  min-height:58px;
}

.tools {
  display:grid;
  grid-template-columns:
    minmax(104px,1.65fr)
    repeat(3,minmax(56px,1fr));
  gap:7px;
  width:100%;
}

.tool-btn {
  min-height:57px;
  padding:8px 5px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  transition:
    background .15s,
    transform .15s,
    border-color .15s;
}

.tool-btn svg {
  width:19px;
  height:19px;
}

.tool-btn span {
  font-size:11px;
  font-weight:650;
  text-align:center;
}

.tool-btn.mic-vi {
  background:var(--green-bg);
  color:var(--green);
  border-color:#A5D3C2;
}

.tool-btn.mic-en {
  background:var(--blue-bg);
  color:var(--blue);
  border-color:#ADC7E9;
  min-width:158px;
  flex-direction:row;
  gap:9px;
  padding:10px 15px;
}

.tool-btn.mic-en span {
  font-size:14px;
}

.tool-btn.recording {
  background:var(--red);
  border-color:var(--red);
  color:white;
}

.tool-btn.clear { color:var(--red); }

.tool-btn:active:not(:disabled),
.icon-btn:active,
.speaker:active {
  transform:scale(.96);
}

.footer-info {
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
  gap:10px;
  padding:2px 4px;
}

.toast {
  position:fixed;
  bottom:calc(22px + env(safe-area-inset-bottom));
  left:50%;
  transform:translate(-50%,15px);
  width:max-content;
  max-width:90vw;
  padding:11px 16px;
  border-radius:12px;
  background:#263344;
  color:white;
  font-size:13px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  opacity:0;
  pointer-events:none;
  transition:opacity .18s,transform .18s;
  z-index:100;
}

.toast.show {
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:520px) {
  .app { gap:9px; }

  .panel {
    padding:11px;
    border-radius:15px;
    gap:9px;
  }

  .panel-title { font-size:16px; }

  .field {
    min-height:153px;
    padding:12px;
  }

  .tools { gap:5px; }

  .tool-btn {
    min-height:59px;
    padding:7px 3px;
  }

  .tool-btn span { font-size:10px; }

  .tool-btn.mic-en span { font-size:13px; }

  .panel-note { font-size:11px; }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation:none!important;
    transition:none!important;
  }
}
</style>
</head>

<body>

<main class="app">

  <header class="header">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
        </svg>
      </div>
      <h1>Voice Translator</h1>
    </div>

    <div class="header-actions">
      <button class="icon-btn" id="fontDown"
        title="Giảm cỡ chữ" aria-label="Giảm cỡ chữ">
        A−
      </button>
      <button class="icon-btn" id="fontUp"
        title="Tăng cỡ chữ" aria-label="Tăng cỡ chữ">
        A+
      </button>
      <button class="icon-btn" id="theme"
        title="Chế độ sáng tối" aria-label="Sáng tối">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="1.8">
          <path d="M20.5 14.2A8.7 8.7 0 0 1
            9.8 3.5 8.8 8.8 0 1 0 20.5 14.2Z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="statusbar" role="status" aria-live="polite">
    <div class="status-left">
      <span class="dot" id="dot"></span>
      <span id="status">Sẵn sàng</span>
    </div>
    <span id="connection">Online</span>
  </div>

  <!-- VIETNAMESE -->

  <section class="panel" id="viPanel">

    <div class="panel-head">
      <div class="panel-title">Tiếng Việt</div>
      <span class="panel-note" id="viNote">
        Vietnamese
      </span>
    </div>

    <textarea
      class="field"
      id="viText"
      spellcheck="true"
      placeholder="Nội dung tiếng Việt sẽ xuất hiện ở đây..."
      aria-label="Nội dung tiếng Việt"
    ></textarea>

    <div class="panel-footer">
      <div class="tools">

        <button class="tool-btn mic-vi" id="viMic">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2"
            stroke-linecap="round">
            <rect x="9" y="3" width="6" height="12" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
          </svg>
          <span id="viMicLabel">Nói tiếng Việt</span>
        </button>

        <button class="tool-btn" id="deleteWord">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/>
          </svg>
          <span>Xóa 1 từ</span>
        </button>

        <button class="tool-btn clear" id="clearVi">
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round">
            <path d="M4 7h16M6 7l1 14h10l1-14M9 7V4h6v3"/>
            <path d="M10 11v6M14 11v6"/>
          </svg>
          <span>Xóa hết</span>
        </button>

        <button class="tool-btn" id="undoVi" disabled>
          <svg viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M9 14 4 9l5-5M4 9h9a7 7 0 0 1 0 14"/>
          </svg>
          <span>Phục hồi</span>
        </button>

      </div>
    </div>

  </section>

  <!-- ENGLISH -->

  <section class="panel" id="enPanel">

    <div class="panel-head">
      <div class="panel-title">

        <button class="speaker" id="speaker"
          title="Phát tiếng Anh rồi nghe khách"
          aria-label="Phát tiếng Anh">
          <svg id="speakerIcon" viewBox="0 0 24 24"
            fill="none" stroke="currentColor"
            stroke-width="1.9"
            stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
            <path d="M15 9a5 5 0 0 1 0 6"/>
            <path d="M18 6a9 9 0 0 1 0 12"/>
          </svg>
        </button>

        <span>English (US)</span>
      </div>

      <span class="panel-note" id="enNote">
        American English
      </span>
    </div>

    <textarea
      class="field"
      id="enText"
      spellcheck="true"
      placeholder="English translation appears here..."
      aria-label="English text"
    ></textarea>

    <div class="panel-footer">
      <button class="tool-btn mic-en" id="enMic">
        <svg viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <rect x="9" y="3" width="6" height="12" rx="3"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
        </svg>
        <span id="enMicLabel">Speak English</span>
      </button>

      <span class="panel-note" id="enHint">
        English → Vietnamese
      </span>
    </div>

  </section>

  <div class="footer-info">
    <span id="stats">0 từ · 0 ký tự</span>
    <span>VI ↔ EN (US)</span>
  </div>

</main>

<div class="toast" id="toast" role="status"></div>

<script>
'use strict';

/*
  VOICE TRANSLATOR

  - Một website dùng cho Safari iPhone,
    Chrome iPhone và Chrome Android.

  - Web Speech API: nhận dạng giọng nói.
  - MyMemory API: dịch trực tuyến.
  - SpeechSynthesis: đọc tiếng Anh.

  - Tiếng Việt -> tiếng Anh:
    nhận dạng, tự dịch, KHÔNG tự phát loa.

  - Nhấn loa tiếng Anh:
    phát bản dịch, rồi thử tự nghe tiếng Anh.

  - Tiếng Anh -> tiếng Việt:
    nhận dạng, tự dịch, chỉ hiện chữ.

  - Không dùng Whisper.
  - Không lưu API key.
  - Cần Internet để nhận dạng/dịch
    trong các trình duyệt thông thường.

  Chú ý:
  iOS có thể chặn việc tự khởi động lại micro.
  Khi đó người dùng bấm Speak English thủ công.

  Dịch vụ miễn phí có giới hạn sử dụng và
  không bảo đảm tính sẵn sàng lâu dài.
*/

// ========================================
// DOM
// ========================================

const $ = id => document.getElementById(id);

const viText = $('viText');
const enText = $('enText');

const viMic = $('viMic');
const enMic = $('enMic');
const speaker = $('speaker');

const viPanel = $('viPanel');
const enPanel = $('enPanel');

const undoVi = $('undoVi');

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

// ========================================
// CONFIGURATION
// ========================================

const CONFIG = {
  vietnamese:'vi-VN',
  english:'en-US',

  // Đợi âm vang của loa giảm rồi mới nghe.
  // Không bảo đảm loại bỏ toàn bộ tiếng vang.
  speakerCooldown:600,

  // Dịch khi người dùng ngừng chỉnh sửa.
  editDebounce:850,

  // Giới hạn chờ dịch vụ dịch.
  translationTimeout:12000,

  // Giới hạn số ký tự mỗi yêu cầu MyMemory.
  maxTranslationLength:450,

  // Không tự ghi âm liên tục nhiều lượt
  // khi không có thao tác của người dùng.
  autoRetryRecognition:false
};

const STORAGE = {
  vi:'vt_vietnamese_v2',
  en:'vt_english_v2',
  theme:'vt_theme_v2',
  font:'vt_font_v2'
};

// ========================================
// STATE
// ========================================

let recognition = null;

let activeLanguage = null;
let recognitionStarting = false;
let recognitionStopping = false;

let recognitionToken = 0;

let sourceText = '';
let finalTranscript = '';

let speakerUtterance = null;
let speaking = false;

let autoListenTimer = null;
let editTimer = null;
let toastTimer = null;

let translationToken = 0;
let translationController = null;

let translationPending = false;

let englishNeedsUpdate = false;
let vietnameseNeedsUpdate = false;

let viUndoStack = [];

let fontSize = 23;

// ========================================
// ICON HELPERS
// ========================================

const MIC_ICON = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round">
<rect x="9" y="3" width="6" height="12" rx="3"/>
<path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>
</svg>`;

const STOP_ICON = `
<svg viewBox="0 0 24 24" fill="none"
stroke="currentColor" stroke-width="2"
stroke-linecap="round">
<rect x="5" y="5" width="14" height="14" rx="3"/>
</svg>`;

// ========================================
// STATUS
// ========================================

function setStatus(message, mode='ready') {
  $('status').textContent = message;
  $('dot').className = 'dot';

  if (mode !== 'ready') {
    $('dot').classList.add(mode);
  }
}

function showToast(message) {
  $('toast').textContent = message;
  $('toast').classList.add('show');

  clearTimeout(toastTimer);

  toastTimer = setTimeout(() => {
    $('toast').classList.remove('show');
  }, 2600);
}

function updateConnection() {
  $('connection').textContent =
    navigator.onLine ? 'Online' : 'Offline';
}

window.addEventListener('online',updateConnection);

window.addEventListener('offline',() => {
  updateConnection();
  showToast('Mất kết nối Internet');
});

updateConnection();

// ========================================
// STORAGE
// ========================================

function safeSave(key,value) {
  try {
    localStorage.setItem(key,value);
  } catch(e) {}
}

function safeRead(key) {
  try {
    return localStorage.getItem(key);
  } catch(e) {
    return null;
  }
}

function saveTexts() {
  safeSave(STORAGE.vi,viText.value);
  safeSave(STORAGE.en,enText.value);
  updateStats();
}

function updateStats() {
  const vi = viText.value.trim();

  const count = vi
    ? vi.split(/\s+/u).length
    : 0;

  $('stats').textContent =
    `${count} từ · ${viText.value.length} ký tự`;
}

// ========================================
// TEXT FORMAT
// ========================================

function appendText(base,addition) {
  const chunk = addition.trim();

  if (!chunk) return base;
  if (!base) return chunk;

  return base +
    (/\s$/u.test(base) ? '' : ' ') +
    chunk;
}

function capitalizeSentences(text) {
  return text.replace(
    /(^|[.!?]\s+|\n\s*)([a-zà-ỹ])/giu,
    (_,prefix,letter) =>
      prefix + letter.toUpperCase()
  );
}

function setVietnamese(text) {
  viText.value = text;
  saveTexts();
}

function setEnglish(text) {
  enText.value = text;
  saveTexts();
}

function scrollBottom(element) {
  element.scrollTop = element.scrollHeight;
}

// ========================================
// VIETNAMESE UNDO
// ========================================

function rememberVietnamese() {
  viUndoStack.push(viText.value);

  if (viUndoStack.length > 40) {
    viUndoStack.shift();
  }

  undoVi.disabled = false;
}

function editVietnamese(text) {
  rememberVietnamese();
  setVietnamese(text);
  scheduleVietnameseTranslation();
}

$('deleteWord').onclick = () => {
  stopRecognitionImmediately();
  cancelSpeaker();

  const text = viText.value.trimEnd();

  if (!text) return;

  const updated =
    text.replace(/\S+$/u,'').trimEnd();

  editVietnamese(updated);

  showToast('Đã xóa 1 từ');
};

$('clearVi').onclick = () => {
  stopRecognitionImmediately();
  cancelSpeaker();

  if (!viText.value) return;

  editVietnamese('');

  showToast('Đã xóa tiếng Việt');
};

undoVi.onclick = () => {
  stopRecognitionImmediately();
  cancelSpeaker();

  if (!viUndoStack.length) return;

  const previous = viUndoStack.pop();

  setVietnamese(previous);

  undoVi.disabled = !viUndoStack.length;

  scheduleVietnameseTranslation();

  showToast('Đã phục hồi');
};

// ========================================
// TRANSLATION REQUESTS
// ========================================

function invalidateTranslation() {
  translationToken++;

  clearTimeout(editTimer);

  if (translationController) {
    translationController.abort();
    translationController = null;
  }

  translationPending = false;

  viText.classList.remove('pending');
  enText.classList.remove('pending');
}

/*
  MyMemory dịch trực tuyến.

  Không dùng endpoint Google Translate
  không chính thức vì có thể bị chặn CORS.

  Giới hạn miễn phí và chất lượng có thể
  khác nhau theo cặp ngôn ngữ.
*/

async function translateOnline(
  text,
  from,
  to,
  signal
) {
  const input = text.trim();

  if (!input) return '';

  if (!navigator.onLine) {
    throw new Error('Không có Internet');
  }

  if (input.length > CONFIG.maxTranslationLength) {
    throw new Error(
      'Đoạn văn quá dài. Hãy nói ngắn hơn.'
    );
  }

  const url = new URL(
    'https://api.mymemory.translated.net/get'
  );

	url.searchParams.set('q', input);
	url.searchParams.set('de', 'lucid.tien11202026@gmail.com');

  url.searchParams.set(
    'langpair',
    `${from}|${to}`
  );

  const response = await fetch(
    url.toString(),
    {
      method:'GET',
      signal,
      cache:'no-store'
    }
  );

  if (!response.ok) {
    throw new Error(
      `Máy chủ dịch lỗi ${response.status}`
    );
  }

  const data = await response.json();

  const status = Number(data.responseStatus);

  if (status !== 200) {
    throw new Error(
      data.responseDetails ||
      'Không thể dịch văn bản'
    );
  }

  const result =
    data.responseData?.translatedText;

  if (typeof result !== 'string' ||
      !result.trim()) {
    throw new Error('Không có bản dịch');
  }

  // Giải mã HTML entities mà không chèn
  // HTML của dịch vụ vào giao diện.
  const decoder = document.createElement('textarea');
  decoder.innerHTML = result;

  const decoded = decoder.value.trim();

  // Tránh hiển thị thông báo giới hạn dịch
  // như thể đó là bản dịch thật.
  if (/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(decoded)) {
    throw new Error('Đã đạt giới hạn dịch miễn phí');
  }

  return decoded;
}

async function translateDirection(
  fromLanguage,
  sourceValue
) {
  invalidateTranslation();

  const requestId = translationToken;

  const isVI = fromLanguage === 'vi';

  const source = sourceValue.trim();

  const target = isVI ? enText : viText;

  if (!source) {
    target.value = '';
    saveTexts();

    englishNeedsUpdate = false;
    vietnameseNeedsUpdate = false;

    setStatus('Sẵn sàng');
    return;
  }

  const controller = new AbortController();

  translationController = controller;
  translationPending = true;

  const timeout = setTimeout(() => {
    controller.abort();
  },CONFIG.translationTimeout);

  target.classList.add('pending');

  // Bản dịch cũ không được dùng để phát loa.
  if (isVI) {
    englishNeedsUpdate = true;
  } else {
    vietnameseNeedsUpdate = true;
  }

  setStatus(
    isVI
      ? 'Đang dịch sang tiếng Anh...'
      : 'Translating to Vietnamese...',
    'working'
  );

  try {
    const output = await translateOnline(
      source,
      isVI ? 'vi' : 'en',
      isVI ? 'en' : 'vi',
      controller.signal
    );

    if (requestId !== translationToken) {
      return;
    }

    target.value = capitalizeSentences(output);

    saveTexts();

    englishNeedsUpdate = false;
    vietnameseNeedsUpdate = false;

    setStatus(
      isVI
        ? 'Đã dịch · Bấm loa để phát'
        : 'Đã dịch · Người bán có thể đọc'
    );

    if (isVI) {
      $('enNote').textContent = 'Đã dịch';
    } else {
      $('viNote').textContent = 'Đã dịch';
    }

  } catch(error) {
    if (requestId !== translationToken) {
      return;
    }

    target.value = '';
    saveTexts();

    const message = error.name === 'AbortError'
      ? 'Dịch quá thời gian chờ'
      : error.message;

    setStatus('Không dịch được','error');
    showToast(message);

  } finally {
    clearTimeout(timeout);

    if (requestId === translationToken) {
      translationController = null;
      translationPending = false;

      target.classList.remove('pending');
    }
  }
}

function scheduleVietnameseTranslation() {
  invalidateTranslation();

  clearTimeout(autoListenTimer);

  const value = viText.value.trim();

  englishNeedsUpdate = !!value;

  // Không giữ bản tiếng Anh cũ sau khi
  // người bán sửa nội dung tiếng Việt.
  setEnglish('');

  if (!value) {
    englishNeedsUpdate = false;
    setStatus('Sẵn sàng');
    return;
  }

  setStatus('Đang chờ dịch...','working');

  editTimer = setTimeout(() => {
    translateDirection('vi',viText.value);
  },CONFIG.editDebounce);
}

// ========================================
// MANUAL TEXT EDITING
// ========================================

viText.addEventListener('input',() => {
  stopRecognitionImmediately();
  cancelSpeaker();

  saveTexts();
  scheduleVietnameseTranslation();
});

enText.addEventListener('input',() => {
  stopRecognitionImmediately();
  cancelSpeaker();

  invalidateTranslation();

  englishNeedsUpdate = false;

  saveTexts();

  // Khi chỉnh trực tiếp câu tiếng Anh,
  // ô tiếng Việt sẽ được dịch lại.
  clearTimeout(editTimer);

  editTimer = setTimeout(() => {
    translateDirection('en',enText.value);
  },CONFIG.editDebounce);
});

// ========================================
// TEXT TO SPEECH
// ========================================

function stopAutoListen() {
  clearTimeout(autoListenTimer);
  autoListenTimer = null;
}

function updateSpeakerUI(isPlaying) {
  speaker.classList.toggle('playing',isPlaying);

  speaker.setAttribute(
    'aria-label',
    isPlaying
      ? 'Dừng phát tiếng Anh'
      : 'Phát tiếng Anh'
  );
}

function cancelSpeaker() {
  stopAutoListen();

  speaking = false;
  speakerUtterance = null;

  if ('speechSynthesis' in window) {
    speechSynthesis.cancel();
  }

  updateSpeakerUI(false);
}

function findEnglishVoice() {
  if (!('speechSynthesis' in window)) {
    return null;
  }

  const voices = speechSynthesis.getVoices();

  return voices.find(
    v => v.lang.toLowerCase() === 'en-us'
  ) || voices.find(
    v => v.lang.toLowerCase().startsWith('en')
  ) || null;
}

function playEnglish() {
  if (!('speechSynthesis' in window)) {
    showToast('Không hỗ trợ phát âm thanh');
    return;
  }

  // Bấm loa khi đang phát => dừng.
  if (speaking) {
    cancelSpeaker();
    setStatus('Đã dừng phát');
    return;
  }

  if (translationPending || englishNeedsUpdate) {
    showToast('Bản dịch chưa sẵn sàng');
    return;
  }

  const text = enText.value.trim();

  if (!text) {
    showToast('Chưa có câu tiếng Anh');
    return;
  }

  stopRecognitionImmediately();
  cancelSpeaker();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = CONFIG.english;

  utterance.rate = 0.95;
  utterance.pitch = 1;
  utterance.volume = 1;

  const voice = findEnglishVoice();

  if (voice) {
    utterance.voice = voice;
  }

  speakerUtterance = utterance;

  let actuallyStarted = false;
  let completed = false;

  utterance.onstart = () => {
    if (speakerUtterance !== utterance) return;

    actuallyStarted = true;
    speaking = true;

    updateSpeakerUI(true);

    setStatus('Speaking English...','working');
  };

  utterance.onend = () => {
    if (speakerUtterance !== utterance) return;

    if (completed) return;
    completed = true;

    speaking = false;
    speakerUtterance = null;

    updateSpeakerUI(false);

    // Không nghe ngay lập tức khi âm thanh
    // còn vang từ loa điện thoại.
    //
    // Trình duyệt iPhone có thể chặn thao tác
    // tự khởi động micro. Nút bấm vẫn là dự phòng.

    if (actuallyStarted) {
      setStatus('Chuẩn bị nghe khách...','working');

      autoListenTimer = setTimeout(() => {
        autoListenTimer = null;

        if (!speaking && !activeLanguage) {
          startRecognition('en',true);
        }
      },CONFIG.speakerCooldown);
    }
  };

  utterance.onerror = () => {
    if (speakerUtterance !== utterance) return;

    speaking = false;
    speakerUtterance = null;

    updateSpeakerUI(false);

    setStatus('Không phát được tiếng Anh','error');

    showToast(
      'Không thể phát âm thanh. Hãy kiểm tra loa.'
    );
  };

  try {
    speechSynthesis.cancel();
    speechSynthesis.speak(utterance);

    setStatus('Đang chuẩn bị phát tiếng Anh...','working');

  } catch(error) {
    speaking = false;
    speakerUtterance = null;

    updateSpeakerUI(false);

    showToast('Không khởi động được loa');
  }
}

speaker.onclick = playEnglish;

// ========================================
// RECOGNITION UI
// ========================================

function updateMicUI(language,isActive) {
  const button = language === 'vi'
    ? viMic
    : enMic;

  const label = language === 'vi'
    ? $('viMicLabel')
    : $('enMicLabel');

  button.classList.toggle('recording',isActive);

  const icon = button.querySelector('svg');

  if (icon) {
    icon.outerHTML = isActive
      ? STOP_ICON
      : MIC_ICON;
  }

  label.textContent = isActive
    ? (language === 'vi'
        ? 'Dừng nói'
        : 'Stop Listening')
    : (language === 'vi'
        ? 'Nói tiếng Việt'
        : 'Speak English');

  viPanel.classList.toggle(
    'active',
    isActive && language === 'vi'
  );

  enPanel.classList.toggle(
    'english-active',
    isActive && language === 'en'
  );
}

function resetMicUI() {
  updateMicUI('vi',false);
  updateMicUI('en',false);
}

function stopRecognitionImmediately() {
  stopAutoListen();

  recognitionToken++;

  const previous = recognition;

  recognition = null;
  activeLanguage = null;

  recognitionStarting = false;
  recognitionStopping = false;

  if (previous) {
    try {
      previous.abort();
    } catch(e) {}
  }

  resetMicUI();
}

// ========================================
// STOP MICRO AND KEEP FINAL RESULT
// ========================================

function stopRecognitionGracefully() {
  if (!recognition) {
    stopRecognitionImmediately();
    return;
  }

  recognitionStopping = true;

  setStatus('Đang hoàn tất câu...','working');

  try {
    recognition.stop();
  } catch(error) {
    stopRecognitionImmediately();
  }
}

// ========================================
// SPEECH RECOGNITION
// ========================================

function startRecognition(language,automatic=false) {
  stopAutoListen();

  if (!SpeechRecognition) {
    setStatus('Trình duyệt không hỗ trợ micro','error');

    showToast(
      'Trình duyệt không hỗ trợ Speech Recognition.'
    );

    return;
  }

  if (speaking) {
    cancelSpeaker();
  }

  if (activeLanguage || recognitionStarting) {
    stopRecognitionImmediately();
  }

  // Không cho kết quả dịch cũ tiếp tục
  // ghi đè khi người dùng đổi ngôn ngữ.
  invalidateTranslation();

  const token = ++recognitionToken;

  const isVI = language === 'vi';

  const target = isVI ? viText : enText;

  activeLanguage = language;
  recognitionStarting = true;
  recognitionStopping = false;

  sourceText = target.value;
  finalTranscript = '';

  const session = new SpeechRecognition();

  recognition = session;

  session.lang = isVI
    ? CONFIG.vietnamese
    : CONFIG.english;

  // Giữ phương pháp nhận dạng của bản cũ.
  // Một lượt nghe -> tự kết thúc -> dịch.
  // Người dùng không phải giữ nút micro.

  session.continuous = false;
  session.interimResults = true;
  session.maxAlternatives = 1;

  let sessionFinal = '';
  let sessionInterim = '';
  let sessionError = null;
  let alreadyFinished = false;

  // --------------------------------------
  // MICRO STARTED
  // --------------------------------------

  session.onstart = () => {
    if (token !== recognitionToken) {
      try { session.abort(); } catch(e) {}
      return;
    }

    recognitionStarting = false;

    updateMicUI(language,true);

    setStatus(
      isVI
        ? 'Đang nghe tiếng Việt...'
        : 'Listening to English...',
      'listening'
    );
  };

  // --------------------------------------
  // RECOGNIZED WORDS
  // --------------------------------------

  session.onresult = event => {
    if (token !== recognitionToken) return;

    sessionFinal = '';
    sessionInterim = '';

    for (
      let i=0;
      i<event.results.length;
      i++
    ) {
      const result = event.results[i];

      const phrase =
        result[0]?.transcript?.trim() || '';

      if (!phrase) continue;

      if (result.isFinal) {
        sessionFinal = appendText(
          sessionFinal,
          phrase
        );
      } else {
        sessionInterim = appendText(
          sessionInterim,
          phrase
        );
      }
    }

    finalTranscript = sessionFinal;

    let visible = sourceText;

    if (sessionFinal) {
      visible = appendText(
        visible,
        sessionFinal
      );
    }

    if (sessionInterim) {
      visible = appendText(
        visible,
        sessionInterim
      );
    }

    target.value = capitalizeSentences(visible);

    updateStats();
    scrollBottom(target);
  };

  // --------------------------------------
  // ERRORS
  // --------------------------------------

  session.onerror = event => {
    if (token !== recognitionToken) return;

    sessionError = event.error;

    if (event.error === 'no-speech') {
      setStatus(
        automatic
          ? 'Chưa nghe khách nói'
          : 'Chưa nghe thấy giọng nói',
        'error'
      );
      return;
    }

    if (
      event.error === 'not-allowed' ||
      event.error === 'service-not-allowed'
    ) {
      setStatus('Micro bị chặn','error');

      showToast(
        automatic
          ? 'Hãy bấm Speak English để bật micro.'
          : 'Hãy cấp quyền sử dụng micro.'
      );
      return;
    }

    if (event.error === 'audio-capture') {
      setStatus('Không tìm thấy micro','error');
      showToast('Hãy kiểm tra micro điện thoại');
      return;
    }

    if (event.error === 'network') {
      setStatus('Lỗi mạng khi nhận dạng','error');
      showToast('Nhận dạng cần kết nối Internet');
      return;
    }

    if (event.error !== 'aborted') {
      setStatus('Không nhận dạng được','error');

      showToast(
        automatic
          ? 'Bấm Speak English để thử lại.'
          : 'Hãy thử nói lại.'
      );
    }
  };

  // --------------------------------------
  // FINISH RECOGNITION
  // --------------------------------------

  session.onend = async () => {
    if (token !== recognitionToken) return;
    if (alreadyFinished) return;

    alreadyFinished = true;

    recognition = null;
    activeLanguage = null;

    recognitionStarting = false;
    recognitionStopping = false;

    resetMicUI();

    // Không lấy kết quả tạm làm bản dịch.
    // Chỉ sử dụng kết quả cuối cùng.
    const recognized = sessionFinal.trim();

    if (!recognized) {
      target.value = sourceText;

      updateStats();

      if (!sessionError) {
        setStatus('Chưa nhận được câu hoàn chỉnh');
      }

      if (automatic) {
        showToast(
          'Nếu khách đã nói, bấm Speak English để thử lại.'
        );
      }

      return;
    }

    // Ghi nhận một lần, không nhân đôi
    // các từ đã được nhận dạng.
    const completeText = capitalizeSentences(
      appendText(sourceText,recognized)
    );

    // Với hội thoại bán hàng, giữ lại
    // nội dung vừa nhận dạng trong ô nguồn.
    target.value = completeText;

    saveTexts();

    setStatus('Đã nhận dạng · Đang dịch...','working');

    // Dịch từ chính ngôn ngữ vừa nghe.
    await translateDirection(
      language,
      completeText
    );
  };

  // --------------------------------------
  // OPEN MICRO
  // --------------------------------------

  try {
    setStatus(
      automatic
        ? 'Đang tự bật micro tiếng Anh...'
        : 'Đang mở micro...',
      'working'
    );

    session.start();

  } catch(error) {
    if (token !== recognitionToken) return;

    recognition = null;
    activeLanguage = null;

    recognitionStarting = false;

    resetMicUI();

    setStatus('Không mở được micro','error');

    showToast(
      automatic
        ? 'iPhone có thể yêu cầu bấm Speak English.'
        : 'Không mở được micro. Hãy thử lại.'
    );
  }
}

// ========================================
// BUTTON: VIETNAMESE
// ========================================

viMic.onclick = () => {
  if (activeLanguage === 'vi') {
    stopRecognitionGracefully();
    return;
  }

  stopRecognitionImmediately();
  cancelSpeaker();

  startRecognition('vi',false);
};

// ========================================
// BUTTON: ENGLISH
// ========================================

enMic.onclick = () => {
  if (activeLanguage === 'en') {
    stopRecognitionGracefully();
    return;
  }

  stopRecognitionImmediately();
  cancelSpeaker();

  startRecognition('en',false);
};

// ========================================
// FONT SIZE
// ========================================

function applyFontSize() {
  viText.style.fontSize = fontSize + 'px';
  enText.style.fontSize = fontSize + 'px';

  safeSave(STORAGE.font,String(fontSize));
}

$('fontUp').onclick = () => {
  fontSize = Math.min(36,fontSize+2);
  applyFontSize();
};

$('fontDown').onclick = () => {
  fontSize = Math.max(16,fontSize-2);
  applyFontSize();
};

// ========================================
// THEME
// ========================================

$('theme').onclick = () => {
  document.body.classList.toggle('dark');

  safeSave(
    STORAGE.theme,
    document.body.classList.contains('dark')
      ? 'dark'
      : 'light'
  );
};

// ========================================
// INITIALIZATION
// ========================================

function initialize() {
  viText.value = safeRead(STORAGE.vi) || '';
  enText.value = safeRead(STORAGE.en) || '';

  const savedFont = Number(
    safeRead(STORAGE.font)
  );

  if (
    Number.isFinite(savedFont) &&
    savedFont >= 16 &&
    savedFont <= 36
  ) {
    fontSize = savedFont;
  }

  if (safeRead(STORAGE.theme) === 'dark') {
    document.body.classList.add('dark');
  }

  applyFontSize();
  updateStats();
  resetMicUI();

  if (!SpeechRecognition) {
    setStatus(
      'Trình duyệt không hỗ trợ nhận dạng',
      'error'
    );

    viMic.disabled = true;
    enMic.disabled = true;

    return;
  }

  if (!window.isSecureContext) {
    setStatus('Cần HTTPS để sử dụng micro','error');
    return;
  }

  setStatus('Sẵn sàng');
}

initialize();

// ========================================
// PAGE LIFECYCLE
// ========================================

window.addEventListener('pagehide',() => {
  stopRecognitionImmediately();
  cancelSpeaker();
  invalidateTranslation();
  saveTexts();
});

</script>
